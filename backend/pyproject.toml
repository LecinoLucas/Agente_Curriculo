[tool.poetry]
name = "resume-ai-system"
version = "0.1.0"
description = "Sistema de análise inteligente de currículos com IA"
authors = ["Team <team@company.com>"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = { extras = ["standard"], version = "^0.115.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.0" }
alembic = "^1.13.0"
asyncpg = "^0.30.0"
redis = { extras = ["hiredis"], version = "^5.2.0" }
celery = { extras = ["redis"], version = "^5.4.0" }
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
pydantic-settings = "^2.4.0"
python-multipart = "^0.0.12"
structlog = "^24.4.0"
sentry-sdk = { extras = ["fastapi"], version = "^2.0.0" }
httpx = "^0.27.0"
bcrypt = "^5.0.0"
anthropic = "^0.40.0"
pdfplumber = "^0.11.9"
limits = "^5.8.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
factory-boy = "^3.3.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
sqlalchemy = { extras = ["mypy"], version = "^2.0.0" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI Depends() calls in function args

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
markers = [
    "postgres: integration tests that require a real PostgreSQL test database and must be run explicitly with -m postgres",
    "unit: testes unitários — dependências mockadas, sem DB/IO",
    "integration: testes que sobem app/DB SQLite em memória via fixtures",
    "e2e: cenários ponta-a-ponta longos (fluxo ATS completo, demo full flow)",
    "security: testes de segurança/RBAC/LGPD/auth/secrets/upload",
    "slow: testes >1s ou que executam cadeias pesadas (manter fora do smoke)",
    "smoke: subset crítico para verificação rápida pós-mudança",
    "legacy: teste preservado mas com fixtures/contrato desatualizados — pendente de reescrita em fase dedicada; excluído do smoke",
]
filterwarnings = [
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated and slated for removal in Python 3\\.16:DeprecationWarning:fastapi\\.routing",
    "ignore:'asyncio\\.iscoroutinefunction' is deprecated and slated for removal in Python 3\\.16:DeprecationWarning:starlette\\._utils",
    "ignore:coroutine 'Connection\\._cancel' was never awaited:RuntimeWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.pyright]
include = ["src"]
extraPaths = ["."]
