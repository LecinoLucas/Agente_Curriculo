# ─────────────────────────────────────────────────────────────────────────────
# DEPLOY-DOCKER-LOCAL-SPLIT-1
# Local development stack with all services containerised.
#
# Quick start:
#   cp .env.docker.example .env.docker
#   # edit .env.docker with real secrets
#   docker compose -f docker-compose.local.yml up -d postgres redis
#   docker compose -f docker-compose.local.yml run --rm backend-api alembic upgrade head
#   docker compose -f docker-compose.local.yml up -d
#
# Ports exposed on host:
#   5432  postgres
#   6379  redis
#   8000  backend-api
#   5173  frontend-staff  (nginx serving built SPA)
#   5174  candidate-portal (nginx serving built SPA)
# ─────────────────────────────────────────────────────────────────────────────

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - .env.docker.local
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - internal

services:

  # ──────────────────────────────────────────
  # INFRASTRUCTURE
  # ──────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resume_ai}
      POSTGRES_USER: ${POSTGRES_USER:-resume_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume_user} -d ${POSTGRES_DB:-resume_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  # ──────────────────────────────────────────
  # BACKEND API
  # ──────────────────────────────────────────

  backend-api:
    <<: *backend-common
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ──────────────────────────────────────────
  # CELERY WORKER
  # ──────────────────────────────────────────

  celery-worker:
    <<: *backend-common
    command: >
      celery -A src.infrastructure.queue.celery_app worker
      --loglevel=info
      -Q analysis,extraction,matching,document_ai,behavioral_ai

  # ──────────────────────────────────────────
  # CELERY BEAT (periodic tasks)
  # ──────────────────────────────────────────

  celery-beat:
    <<: *backend-common
    command: >
      celery -A src.infrastructure.queue.celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler

  # ──────────────────────────────────────────
  # FRONTENDS
  # ──────────────────────────────────────────

  frontend-staff:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_CANDIDATE_PORTAL_URL: ${VITE_CANDIDATE_PORTAL_URL:-http://localhost:5174}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "5173:80"
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - internal

  candidate-portal:
    build:
      context: ./candidate-portal
      dockerfile: Dockerfile
      args:
        VITE_PUBLIC_API_BASE_URL: ${VITE_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1/public}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_ENABLE_DEV_CANDIDATE_LOGIN: ${VITE_ENABLE_DEV_CANDIDATE_LOGIN:-false}
    ports:
      - "5174:80"
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
